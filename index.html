<!-- Teacher Question Screen -->
<div id="passwordScreen">
  <div class="glass-card">
    <div id="loginForm">
      <h2>Who is the best teacher?</h2>

      <div class="teacher-options">
        <button type="button" onclick="checkTeacher('Peggy')">
          Peggy
        </button>

        <button type="button" onclick="checkTeacher('Heyma')">
          Heyma
        </button>

        <button type="button" onclick="checkTeacher('Shep')">
          Shep
        </button>

        <button type="button" onclick="checkTeacher('Boggs')">
          Boggs
        </button>
      </div>

      <p id="error">Wrong answer! Try again.</p>
    </div>
  </div>
</div>

<style>
  .teacher-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  #passwordScreen .teacher-options button {
    width: 100%;
    margin-top: 0;
    padding: 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: white;
    cursor: pointer;
    transition: 0.2s ease;
  }

  #passwordScreen .teacher-options button:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-2px);
  }

  #error {
    color: #ff6b6b;
    margin-top: 16px;
    display: none;
  }
</style>

<script>
  function checkTeacher(name) {
    const error = document.getElementById("error");

    if (name === "Heyma") {
      unlockSite();
    } else {
      error.textContent = "Wrong answer! Try again.";
      error.style.display = "block";
    }
  }
</script>

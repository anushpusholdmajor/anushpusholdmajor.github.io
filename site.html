<div id="teacherGate">
    <div class="teacher-box">
        <h1>Who is the best teacher?</h1>
        <p>Choose the right answer to continue.</p>

        <div class="teacher-options">
            <button onclick="checkTeacher('Peggy')">Peggy</button>
            <button onclick="checkTeacher('Heyma')">Heyma</button>
            <button onclick="checkTeacher('Shep')">Shep</button>
            <button onclick="checkTeacher('Boggs')">Boggs</button>
        </div>

        <p id="teacherMessage"></p>
    </div>
</div>

<style>
    #teacherGate {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #080b14;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
    }

    .teacher-box {
        width: 90%;
        max-width: 450px;
        padding: 35px;
        box-sizing: border-box;
        text-align: center;
        background: #151b2b;
        border: 1px solid #303b56;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .teacher-box h1 {
        font-size: 28px;
        margin: 0 0 12px;
    }

    .teacher-box p {
        color: #b9c3d8;
        margin-bottom: 22px;
    }

    .teacher-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .teacher-options button {
        padding: 15px 10px;
        border: 1px solid #394966;
        border-radius: 10px;
        background: #222d43;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .teacher-options button:hover {
        background: #4269ed;
        transform: translateY(-2px);
    }

    #teacherMessage {
        min-height: 20px;
        margin: 20px 0 0;
        font-weight: bold;
    }
</style>

<script>
    // Change this to "Heyma", "Shep", or "Boggs" if needed.
    const correctTeacher = "Peggy";

    function checkTeacher(name) {
        const message = document.getElementById("teacherMessage");

        if (name === correctTeacher) {
            message.textContent = "Correct! Welcome!";
            message.style.color = "#55e69b";

            setTimeout(() => {
                document.getElementById("teacherGate").remove();
            }, 500);
        } else {
            message.textContent = "Wrong answer! Try again.";
            message.style.color = "#ff6565";
        }
    }
</script>
